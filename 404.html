<!DOCTYPE html>
<!-- Page servie par GitHub Pages pour toute adresse introuvable, à n'importe quelle profondeur :
     elle n'utilise donc aucun chemin relatif. Si vous changez de domaine, modifiez SITE ci-dessous. -->
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Page introuvable | Page not found</title>
  <style>
    :root { --primary: #000059; --bg: #f7f7fb; --text: #16162b; --muted: #4b4b66; --on-primary: #fff; }
    @media (prefers-color-scheme: dark) { :root { --primary: #aab3ff; --bg: #0d0f1f; --text: #eceefb; --muted: #b6b9d6; --on-primary: #0d0f1f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 1.05rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; box-sizing: border-box; }
    main { max-width: 520px; text-align: center; }
    .code { font-size: 4rem; font-weight: 800; color: var(--primary); margin: 0; line-height: 1; }
    h1 { font-size: 1.5rem; margin: .75rem 0 .25rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 1.5rem; }
    a { display: inline-block; padding: 12px 20px; border-radius: 10px; font-weight: 600; text-decoration: none;
        border: 2px solid var(--primary); color: var(--primary); }
    a.primary { background: var(--primary); color: var(--on-primary); }
    a:focus-visible { outline: 3px solid #f2a541; outline-offset: 2px; }
    hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); margin: 1.5rem 0; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <hr>
    <h1 lang="en">Page not found</h1>
    <p lang="en">This page doesn't exist or has been moved.</p>
    <div class="links">
      <a class="primary" id="home-fr" href="https://zgaillard.github.io/zgaillard-tutorat/">Retour au site</a>
      <a id="home-en" href="https://zgaillard.github.io/zgaillard-tutorat/en/" lang="en">Back to the site</a>
    </div>
  </main>
</body>
</html>
